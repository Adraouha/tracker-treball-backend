# ============================================================================
# PERFIL DE DESARROLLO (DEV) - TRACKER TREBALL
# ============================================================================
spring.application.name=tracker-treball-backend-dev
server.port=${PORT:8080}

# Base de datos MySQL Local para pruebas y desarrollo
spring.datasource.url=${DEV_DB_URL:jdbc:mysql://localhost:3306/tracker_db_dev?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&characterEncoding=UTF-8}
spring.datasource.username=${DEV_DB_USER:root}
spring.datasource.password=${DEV_DB_PASSWORD:admin}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Codificacion UTF-8 estricta
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.force=true
spring.datasource.hikari.connection-init-sql=SET NAMES utf8mb4 COLLATE utf8mb4_unicode_ci

# JPA y Hibernate en Desarrollo (Muestra SQL y genera DDL)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# CORS flexible para desarrollo local
cors.allowed-origins=http://localhost:5500,http://127.0.0.1:5500,http://localhost:3000,http://localhost:5173

# Subida de ficheros de prueba
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
