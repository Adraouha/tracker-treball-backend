# Configuracion de Tracker Treball Backend
# Autor: Hassan Adraou
spring.application.name=tracker-treball-backend
server.port=${PORT:8080}

# Codificacion UTF-8 estricta y juego de caracteres utf8mb4
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.force=true
server.servlet.encoding.enabled=true
spring.datasource.hikari.connection-init-sql=SET NAMES utf8mb4 COLLATE utf8mb4_unicode_ci

# Conexion a base de datos MySQL 8
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/tracker_db}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:admin}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Configuracion JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Configuracion CORS (variable de entorno con fallback local)
cors.allowed-origins=${CORS_ORIGINS:http://localhost:5500,http://127.0.0.1:5500}

# Internacionalizacion bilingue (Catalan / Castellano)
spring.messages.basename=messages
spring.messages.encoding=UTF-8

# Configuracion de subida de archivos (fotografias de incidentes)
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB
