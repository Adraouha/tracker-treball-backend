# ============================================================================
# PERFIL DE PRODUCCION (PROD) - TRACKER TREBALL
# Inyectado automaticamente en Railway mediante variables de entorno
# ============================================================================
spring.application.name=tracker-treball-backend-prod
server.port=${PORT:8080}

# Base de datos MySQL Gestionada en Railway
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Codificacion UTF-8 estricta
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.force=true
spring.datasource.hikari.connection-init-sql=SET NAMES utf8mb4 COLLATE utf8mb4_unicode_ci

# JPA y Hibernate en Produccion (Optimizada y segura)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# CORS de Produccion (Vercel, Railway y fallback)
cors.allowed-origins=${CORS_ORIGINS:https://tracker-treball.vercel.app,https://adraouha.github.io,http://localhost:5500}

# Subida de archivos
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB
